<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E ² Chat Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; font-size: 16px !important; }
        body { font-family: -apple-system, sans-serif; overflow: hidden; background: #f0f2f5; }

        /* 滑動容器 */
        #main-slider { display: flex; width: 200vw; height: 100vh; transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .page { width: 100vw; height: 100vh; flex-shrink: 0; position: relative; display: flex; flex-direction: column; }

        /* 背景 */
        #chat-bg-layer { position: absolute; inset: 0; z-index: -1; background-color: #efe7dd; background-position: center; background-size: cover; }
        .chat-container { height: 100%; scroll-behavior: smooth; overflow-y: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 氣泡與元件 */
        .bubble { max-width: 80%; padding: 8px 12px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .bubble-me { background-color: #dcf8c6; border-radius: 12px 12px 0 12px; }
        .bubble-other { background-color: #ffffff; border-radius: 0 12px 12px 12px; }
        .sticker-mode { background: transparent !important; box-shadow: none !important; padding: 0 !important; }
        .avatar-box { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; border: 1px solid #eee; background: #fff; flex-shrink: 0; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .media-content { max-width: 180px; border-radius: 8px; display: block; -webkit-touch-callout: default !important; }

        /* 3D Memo */
        #board-page { background: #f0f0f0; overflow-y: auto; padding: 20px; }
        .memo-note { padding: 18px; margin-bottom: 25px; position: relative; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .memo-other { background: #fff9c4; border-left: 5px solid #fbc02d; }
        .memo-me { background: #e3f2fd; border-left: 5px solid #2196f3; }
        .memo-note::after { content: ""; position: absolute; z-index: -1; bottom: 8px; right: 5px; width: 80%; height: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.2); transform: rotate(3deg); }

        /* Overlay & Modals */
        #close-overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: transparent; }
        #photo-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9000; flex-direction: column; align-items: center; justify-content: center; }
        #full-img { max-width: 95%; max-height: 80%; object-fit: contain; -webkit-touch-callout: default !important; }
        
        .heart-react { position: absolute; bottom: -8px; right: 5px; background: white; border-radius: 10px; padding: 1px 5px; font-size: 11px; border: 1px solid #eee; }
        #search-bar { display:none; position: absolute; top:0; width:100%; height:56px; background:white; z-index:100; align-items:center; px:4; border-bottom:1px solid #eee; }
    </style>
</head>
<body>

    <div id="main-slider">
        <div class="page" id="chat-page">
            <div id="chat-bg-layer"></div>
            
            <div id="search-bar" class="flex px-4">
                <i class="fas fa-arrow-left text-gray-500 p-2" onclick="toggleSearch(false)"></i>
                <input id="search-input" type="text" placeholder="搜尋訊息..." class="flex-1 bg-gray-100 rounded-full px-4 py-1 mx-2 outline-none text-sm" oninput="doSearch()">
                <i class="fas fa-times-circle text-gray-300 p-2" onclick="clearSearch()"></i>
            </div>

            <header class="h-14 border-b flex items-center justify-between px-4 bg-white z-20 shadow-sm shrink-0">
                <div class="flex items-center gap-2">
                    <i class="fas fa-pen text-gray-300 text-[12px] p-1.5 border rounded" onclick="openModal('profile-modal')"></i>
                    <span id="user-display" class="font-bold text-sm text-gray-700">Loading...</span>
                </div>
                <div class="flex gap-1 text-gray-400">
                    <i class="fas fa-palette p-2" onclick="openModal('bg-modal')"></i>
                    <i class="fas fa-images p-2" onclick="toggleMediaPage(true)"></i>
                    <i class="fas fa-search p-2" onclick="toggleSearch(true)"></i>
                    <i class="fas fa-trash-alt p-2 text-red-200" onclick="clearAllHistory()"></i>
                </div>
            </header>

            <div id="chat-content" class="chat-container p-4 flex flex-col no-scrollbar flex-1">
                <div id="msg-list" class="flex flex-col"></div>
            </div>

            <div id="reply-preview" class="hidden p-3 bg-white border-l-4 border-green-500 mx-3 mb-2 rounded relative">
                <div id="reply-text" class="text-xs text-gray-400 truncate"></div>
                <i class="fas fa-times absolute right-2 top-2 text-gray-300" onclick="cancelReply()"></i>
            </div>

            <div class="p-3 bg-white flex items-center gap-2 border-t z-30 shrink-0">
                <label class="text-green-600 text-2xl px-1 cursor-pointer"><i class="fas fa-plus-circle"></i><input type="file" id="file-input" class="hidden" accept="image/*" onchange="autoProcessFile(this)"></label>
                <input id="chat-input" class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none" placeholder="輸入訊息...">
                <button onclick="sendMessage()" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane text-sm"></i></button>
            </div>
        </div>

        <div class="page" id="board-page">
            <header class="h-14 flex items-center justify-between mb-6 shrink-0">
                <span class="text-xl font-bold text-gray-800">留言板 📌</span>
                <button onclick="postMemo()" class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-sm font-bold shadow-md">+ 寫留言</button>
            </header>
            <div id="memo-list" class="flex-1 overflow-y-auto no-scrollbar pb-10"></div>
        </div>
    </div>

    <div id="media-page" class="fixed inset-0 bg-white z-[8000] hidden flex-col">
        <header class="h-14 border-b flex items-center px-4"><i class="fas fa-arrow-left p-2 mr-4" onclick="toggleMediaPage(false)"></i><span class="font-bold">圖片庫</span></header>
        <div id="media-grid" class="grid grid-cols-3 gap-1 p-1 overflow-y-auto"></div>
    </div>

    <div id="close-overlay" onclick="closeAll()"></div>
    <div id="reaction-bar" class="hidden fixed z-[3000] bg-white rounded-full shadow-2xl p-2 items-center gap-2">
        <span onclick="addReact('❤️')" class="text-2xl p-1">❤️</span><span onclick="addReact('😂')" class="text-2xl p-1">😂</span><span onclick="addReact('😮')" class="text-2xl p-1">😮</span><span onclick="addReact('😢')" class="text-2xl p-1">😢</span><span onclick="addReact('👍')" class="text-2xl p-1">👍</span>
        <i class="fas fa-plus-circle text-gray-300 text-xl px-1" onclick="customReact()"></i>
    </div>
    <div id="msg-menu" class="hidden fixed z-[3000] bg-white rounded-xl shadow-2xl min-w-[140px] overflow-hidden text-sm">
        <div id="menu-unsend" class="p-4 border-b text-red-500" onclick="executeUnsend()">撤回</div>
        <div class="p-4 text-blue-600" onclick="startReply()">回覆</div>
    </div>
    
    <div id="photo-viewer">
        <img id="full-img" src="" onclick="event.stopPropagation()">
        <a id="dl-btn" href="" download="image.jpg" class="mt-6 bg-white/20 text-white px-6 py-2 rounded-full border border-white/30"><i class="fas fa-download mr-2"></i>Download</a>
        <div class="mt-4 text-white/50 text-xs" onclick="closeAll()">點擊背景關閉</div>
    </div>

    <div id="profile-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-2xl z-[4000] w-[85%] hidden shadow-2xl">
        <h3 class="font-bold mb-4 text-center">設置資料</h3>
        <input id="profile-name-input" type="text" placeholder="顯示名字" class="w-full border rounded-lg p-2 mb-4 outline-none text-sm">
        <button class="w-full bg-blue-500 text-white py-2 rounded-lg mb-2 text-sm" onclick="document.getElementById('avatar-input').click()">選取對方頭像</button>
        <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="processAvatar(this)">
        <button class="w-full bg-green-600 text-white py-2 rounded-lg font-bold" onclick="saveProfile()">儲存</button>
        <button class="w-full mt-2 text-gray-400 text-sm block mx-auto" onclick="closeAll()">取消</button>
    </div>

    <div id="bg-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-2xl z-[4000] w-[85%] hidden shadow-2xl">
        <h3 class="font-bold mb-4 text-center">聊天背景</h3>
        <button class="w-full bg-green-600 text-white py-2 rounded-lg mb-4 text-sm" onclick="document.getElementById('bg-input').click()">選取背景圖</button>
        <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="applyBackground(this)">
        <p class="text-xs text-gray-400 mb-1">透明度</p>
        <input type="range" id="bg-opacity-slider" min="0.1" max="1" step="0.1" class="w-full accent-green-600" oninput="updateBgOpacity(this.value)">
        <button class="w-full mt-4 font-bold text-green-700 pt-4 border-t" onclick="closeAll()">完成</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo", authDomain: "elise-99449.firebaseapp.com", databaseURL: "https://elise-99449-default-rtdb.firebaseio.com", projectId: "elise-99449", storageBucket: "elise-99449.appspot.com", messagingSenderId: "612842016696", appId: "1:612842016696:web:7485447024c7c36a3f094d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        let MY_NAME = urlParams.get('user') || "E", selectedMsg = null, replyTo = null, lastTap = 0, otherAvatar = "", tempAvatar = "";

        // 滑動邏輯
        let startX = 0, currentPage = 0;
        window.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
        window.addEventListener('touchend', e => {
            let diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 80) {
                if (diff > 0 && currentPage === 0) movePage(1);
                else if (diff < 0 && currentPage === 1) movePage(0);
            }
        });
        function movePage(idx) { currentPage = idx; document.getElementById('main-slider').style.transform = `translateX(-${idx * 100}vw)`; }

        // 背景與初始化
        window.onload = () => {
            const b = localStorage.getItem('chat-bg'), o = localStorage.getItem('chat-bg-opacity') || "1";
            if(b) document.getElementById('chat-bg-layer').style.backgroundImage = `url(${b})`;
            document.getElementById('chat-bg-layer').style.opacity = o;
            document.getElementById('bg-opacity-slider').value = o;
        };

        // Firebase 監聽
        db.ref('notes/profile').on('value', s => { 
            const data = s.val() || {};
            document.getElementById('user-display').innerText = (data.name || "E ²") + " (" + MY_NAME + ")";
            otherAvatar = data.avatar || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        });

        db.ref('chats').on('value', snap => {
            const list = document.getElementById('msg-list');
            let html = "", lastD = "";
            snap.forEach(c => {
                const m = c.val();
                const isMe = m.sender === MY_NAME;
                const d = new Date(m.timestamp).toLocaleDateString();
                if(d !== lastD) { html += `<div class="text-center my-4"><span class="bg-black/10 text-white text-[10px] px-2 py-0.5 rounded-full">${d}</span></div>`; lastD = d; }
                const content = m.type === 'sticker' ? `<img src="${m.data}" class="media-content" onclick="zoomImg('${m.data}')">` : `<span>${m.text}</span>`;
                const reply = m.replyTo ? `<div class="text-[10px] opacity-40 border-l-2 border-green-500 pl-1 mb-1 truncate">${m.replyTo.text}</div>` : "";
                const avatar = !isMe ? `<div class="avatar-box mr-2"><img src="${otherAvatar}"></div>` : "";
                
                html += `<div class="msg-row flex ${isMe?'justify-end':'justify-start'} mb-3 px-1" onclick="handleMsgClick('${c.key}')" ontouchstart="handleStart('${c.key}','${m.sender}','${encodeURIComponent(m.text||"")}', event)" ontouchend="clearTimeout(window.lp)">
                    ${avatar}
                    <div class="flex flex-col ${isMe?'items-end':'items-start'}">
                        <div class="flex ${isMe?'flex-row':'flex-row-reverse'} items-end gap-1">
                            <span class="text-[9px] text-gray-400 mb-1">${new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                            <div class="bubble ${isMe?'bubble-me':'bubble-other'} ${m.type==='sticker'?'sticker-mode':''}">
                                ${reply}${content}${m.reaction?`<div class="heart-react">${m.reaction}</div>`:""}
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
            const box = document.getElementById('chat-content'); box.scrollTop = box.scrollHeight;
        });

        db.ref('board').on('value', snap => {
            const list = document.getElementById('memo-list'); list.innerHTML = "";
            snap.forEach(c => {
                const m = c.val(); const d = new Date(m.time); const color = (m.user === MY_NAME) ? 'memo-me' : 'memo-other';
                list.innerHTML += `<div class="memo-note ${color}" oncontextmenu="if(confirm('刪除留言？')) db.ref('board/${c.key}').remove(); return false;">
                    <div class="text-gray-900 text-[15px]">${m.text}</div>
                    <div class="text-[10px] text-gray-400 text-right mt-3 italic">${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            });
        });

        // 功能函數
        function sendMessage() {
            const i = document.getElementById('chat-input');
            if(i.value.trim() || replyTo) {
                db.ref('chats').push({ text: i.value, sender: MY_NAME, timestamp: Date.now(), replyTo: replyTo });
                i.value = ""; cancelReply();
            }
        }

        function handleStart(id, s, t, e) {
            if (e.target.tagName === 'IMG') return;
            selectedMsg = {id, sender:s, text:decodeURIComponent(t)};
            window.lp = setTimeout(() => {
                const r = e.touches[0];
                document.getElementById('close-overlay').style.display = 'block';
                const bar = document.getElementById('reaction-bar'), menu = document.getElementById('msg-menu');
                bar.style.display = 'flex'; bar.style.top = (r.clientY - 110) + 'px'; bar.style.left = '50%'; bar.style.transform = 'translateX(-50%)';
                menu.style.display = 'block'; menu.style.top = (r.clientY + 10) + 'px'; menu.style.left = (r.clientX > 200 ? r.clientX - 140 : r.clientX) + 'px';
                document.getElementById('menu-unsend').style.display = (s===MY_NAME)?'block':'none';
                if(navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }

        function handleMsgClick(id) { const now = Date.now(); if (now - lastTap < 300) { db.ref('chats/'+id).update({reaction:'❤️'}); } lastTap = now; }
        function addReact(emo) { if(selectedMsg) db.ref('chats/'+selectedMsg.id).update({reaction:emo}); closeAll(); }
        function customReact() { const e = prompt("輸入 Emoji:"); if(e) addReact(e); }
        function executeUnsend() { if(selectedMsg) db.ref('chats/'+selectedMsg.id).remove(); closeAll(); }
        function startReply() { replyTo={id:selectedMsg.id, text:selectedMsg.text||"[圖片]"}; document.getElementById('reply-preview').style.display='block'; document.getElementById('reply-text').innerText=replyTo.text; closeAll(); }
        function cancelReply() { replyTo=null; document.getElementById('reply-preview').style.display='none'; }
        
        function zoomImg(s) { 
            document.getElementById('full-img').src=s; 
            document.getElementById('dl-btn').href=s;
            document.getElementById('photo-viewer').style.display='flex'; 
        }

        function toggleSearch(show) { document.getElementById('search-bar').style.display = show?'flex':'none'; if(!show) clearSearch(); }
        function doSearch() { 
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.msg-row').forEach(row => { row.style.display = row.innerText.toLowerCase().includes(val) ? 'flex' : 'none'; });
        }
        function clearSearch() { document.getElementById('search-input').value=""; doSearch(); }
        function clearAllHistory() { if(confirm("⚠️ 確定要清空所有對話紀錄嗎？")) db.ref('chats').remove(); }
        
        function toggleMediaPage(show) { 
            const p = document.getElementById('media-page'); p.style.display = show?'flex':'none';
            if(show) {
                const grid = document.getElementById('media-grid'); grid.innerHTML="";
                db.ref('chats').once('value', s => {
                    s.forEach(c => { if(c.val().type==='sticker') grid.innerHTML += `<img src="${c.val().data}" class="aspect-square object-cover" onclick="zoomImg('${c.val().data}')">`; });
                });
            }
        }

        function applyBackground(i) { if(i.files[0]){ const r=new FileReader(); r.onload=e=>{ document.getElementById('chat-bg-layer').style.backgroundImage=`url(${e.target.result})`; localStorage.setItem('chat-bg',e.target.result); }; r.readAsDataURL(i.files[0]); } }
        function updateBgOpacity(v) { document.getElementById('chat-bg-layer').style.opacity=v; localStorage.setItem('chat-bg-opacity',v); }
        function processAvatar(i) { if(i.files[0]){ const r=new FileReader(); r.onload=e=>{ tempAvatar=e.target.result; }; r.readAsDataURL(i.files[0]); } }
        function saveProfile() { const n=document.getElementById('profile-name-input').value; const up={}; if(n) up.name=n; if(tempAvatar) up.avatar=tempAvatar; db.ref('notes/profile').update(up); closeAll(); }
        function autoProcessFile(i) { if(i.files[0]){ const r=new FileReader(); r.onload=e=>{ db.ref('chats').push({type:'sticker', data:e.target.result, sender:MY_NAME, timestamp:Date.now()}); i.value=""; }; r.readAsDataURL(i.files[0]); } }
        function postMemo() { const t=prompt("留言內容:"); if(t) db.ref('board').push({text:t, user:MY_NAME, time:Date.now()}); }
        function openModal(id) { document.getElementById(id).style.display='block'; document.getElementById('close-overlay').style.display='block'; }
        function closeAll() { ['profile-modal','bg-modal','close-overlay','msg-menu','reaction-bar','photo-viewer'].forEach(id=>document.getElementById(id).style.display='none'); }
    </script>
</body>
</html>
