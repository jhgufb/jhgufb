<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E ²</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #efe7dd; font-family: -apple-system, sans-serif; overflow: hidden; touch-action: manipulation; }
        .chat-container { height: calc(100vh - 130px); scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 8px 12px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .bubble-me { background-color: #dcf8c6; border-radius: 12px 12px 0 12px; align-self: flex-end; }
        .bubble-other { background-color: #ffffff; border-radius: 12px 12px 12px 0; align-self: flex-start; }
        .sticker-mode { background: transparent !important; box-shadow: none !important; padding: 0 !important; border: none !important; }
        .media-content { max-width: 180px; border-radius: 8px; display: block; margin: 4px 0; cursor: pointer; }
        #reaction-bar, #msg-menu { display: none; position: fixed; z-index: 500; background: white; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); border: 1px solid #eee; min-width: 120px; }
        .date-divider { text-align: center; margin: 20px 0; }
        .date-divider span { background: rgba(0,0,0,0.2); color: white; padding: 3px 12px; border-radius: 10px; font-size: 11px; }
        .heart-react { position: absolute; bottom: -8px; right: 5px; background: white; border-radius: 10px; padding: 1px 5px; font-size: 12px; border: 1px solid #eee; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 400; display: none; }
        #search-bar { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 56px; background: white; z-index: 100; align-items: center; padding: 0 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 全屏睇相功能 */
        #photo-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #photo-viewer img { max-width: 95%; max-height: 90%; object-fit: contain; }

        #media-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; overflow-y: auto; }
        .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .media-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #f0f0f0; cursor: pointer; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-white border-x">

    <div id="close-overlay" class="overlay" onclick="closeAll()"></div>

    <div id="photo-viewer" onclick="this.style.display='none'">
        <img id="full-img" src="">
    </div>

    <div id="search-bar">
        <i class="fas fa-arrow-left text-gray-500 cursor-pointer p-2" onclick="toggleSearch(false)"></i>
        <input id="search-input" type="text" placeholder="搜尋訊息..." class="flex-1 mx-2 outline-none text-sm" oninput="doSearch()">
        <i class="fas fa-times text-gray-500 cursor-pointer p-2" onclick="clearSearch()"></i>
    </div>

    <div id="media-page">
        <header class="h-14 border-b flex items-center px-4 bg-white sticky top-0 z-10">
            <i class="fas fa-arrow-left text-gray-700 cursor-pointer p-2 mr-4" onclick="toggleMediaPage(false)"></i>
            <span class="font-bold">所有媒體</span>
        </header>
        <div id="media-grid-container" class="media-grid"></div>
    </div>

    <div id="reaction-bar" class="p-2 flex gap-3 justify-center">
        <span class="cursor-pointer text-2xl" onclick="addReact('❤️')">❤️</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😂')">😂</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😮')">😮</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😢')">😢</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('👍')">👍</span>
    </div>

    <div id="msg-menu">
        <div id="menu-unsend" class="p-4 text-red-500 font-bold border-b active:bg-gray-100 cursor-pointer flex items-center gap-3" onclick="executeUnsend()">
            <i class="fas fa-undo"></i> 撤回
        </div>
        <div class="p-4 text-blue-600 active:bg-gray-100 cursor-pointer flex items-center gap-3" onclick="startReply()">
            <i class="fas fa-reply"></i> 回覆
        </div>
    </div>

    <header class="h-14 border-b flex items-center justify-between px-4 bg-white z-20">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span id="user-display" class="font-bold text-sm text-gray-700">E ²</span>
        </div>
        <div class="flex gap-1">
            <i class="fas fa-images text-gray-400 cursor-pointer p-2 hover:bg-gray-100 rounded-full" onclick="toggleMediaPage(true)"></i>
            <i class="fas fa-search text-gray-400 cursor-pointer p-2 hover:bg-gray-100 rounded-full" onclick="toggleSearch(true)"></i>
            <i class="fas fa-trash-alt text-red-200 cursor-pointer p-2 hover:bg-red-50 rounded-full" onclick="clearAllHistory()"></i>
        </div>
    </header>

    <div id="chat-content" class="chat-container overflow-y-auto p-4 flex flex-col no-scrollbar"></div>

    <div id="reply-preview" class="hidden p-3 bg-gray-100 border-l-4 border-green-500 relative mx-2 mb-2 rounded shadow-sm">
        <div id="reply-text" class="text-xs text-gray-600 truncate"></div>
        <i class="fas fa-times absolute right-2 top-2 text-gray-400 p-1 cursor-pointer" onclick="cancelReply()"></i>
    </div>

    <div class="p-3 bg-[#f0f2f5] flex items-center gap-2 border-t">
        <label class="text-green-600 text-2xl px-1 cursor-pointer">
            <i class="fas fa-plus-circle"></i>
            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="autoProcessFile(this)">
        </label>
        <input id="chat-input" class="flex-1 bg-white rounded-full px-4 py-2 text-sm outline-none shadow-sm" placeholder="打字或貼 Sticker..." autocomplete="off">
        <button onclick="sendMessage()" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center active:scale-90 shadow-md">
            <i class="fas fa-paper-plane text-sm"></i>
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo",
            authDomain: "elise-99449.firebaseapp.com",
            databaseURL: "https://elise-99449-default-rtdb.firebaseio.com",
            projectId: "elise-99449",
            storageBucket: "elise-99449.appspot.com",
            messagingSenderId: "612842016696",
            appId: "1:612842016696:web:7485447024c7c36a3f094d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        let MY_NAME = urlParams.get('user') || "E";
        document.getElementById('user-display').innerText = "E ² (" + MY_NAME + ")";

        let longPressTimer, selectedMsg = null, replyTo = null, allMessages = [];

        // 放大相片功能
        function zoomImg(src) {
            document.getElementById('full-img').src = src;
            document.getElementById('photo-viewer').style.display = 'flex';
        }

        function toggleMediaPage(show) {
            const page = document.getElementById('media-page');
            const grid = document.getElementById('media-grid-container');
            page.style.display = show ? 'block' : 'none';
            if(show) {
                grid.innerHTML = "";
                allMessages.filter(m => m.type === 'sticker').reverse().forEach(m => {
                    grid.innerHTML += `<img src="${m.data}" onclick="zoomImg('${m.data}')">`;
                });
            }
        }

        function clearAllHistory() {
            if (confirm("⚠️ 確定要刪除所有紀錄嗎？")) db.ref('chats').remove();
        }

        function toggleSearch(show) {
            document.getElementById('search-bar').style.display = show ? 'flex' : 'none';
            if(show) document.getElementById('search-input').focus();
            else clearSearch();
        }

        function clearSearch() { document.getElementById('search-input').value = ""; doSearch(); }

        function doSearch() {
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.msg-wrapper').forEach(wrapper => {
                const text = wrapper.querySelector('.bubble span')?.innerText.toLowerCase() || "";
                wrapper.style.display = text.includes(val) ? 'flex' : 'none';
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() && !replyTo) return;
            db.ref('chats').push({ type:'text', text: input.value, sender: MY_NAME, timestamp: Date.now(), seen: false, replyTo: replyTo });
            input.value = ""; cancelReply();
        }

        function sendMedia(data) {
            db.ref('chats').push({ type:'sticker', data: data, sender: MY_NAME, timestamp: Date.now(), seen: false });
        }

        function handleStart(id, sender, text, e) {
            selectedMsg = { id, sender, text };
            longPressTimer = setTimeout(() => {
                const rect = e.touches ? e.touches[0] : e;
                const bar = document.getElementById('reaction-bar');
                const menu = document.getElementById('msg-menu');
                const overlay = document.getElementById('close-overlay');
                document.getElementById('menu-unsend').style.display = (sender === MY_NAME) ? 'flex' : 'none';
                overlay.style.display = 'block';
                bar.style.display = 'flex'; bar.style.top = (rect.clientY - 80) + 'px'; bar.style.left = '20px';
                menu.style.display = 'block'; menu.style.top = (rect.clientY + 10) + 'px'; menu.style.left = '20px';
            }, 600);
        }

        function closeAll() { 
            document.getElementById('msg-menu').style.display = 'none'; 
            document.getElementById('reaction-bar').style.display = 'none'; 
            document.getElementById('close-overlay').style.display = 'none';
        }

        function addReact(emoji) { if(selectedMsg) db.ref('chats/'+selectedMsg.id).update({ reaction: emoji }); closeAll(); }
        function executeUnsend() { if(selectedMsg && selectedMsg.sender === MY_NAME) db.ref('chats/'+selectedMsg.id).remove(); closeAll(); }
        
        function startReply() { 
            const decodedText = decodeURIComponent(selectedMsg.text);
            replyTo = { user: selectedMsg.sender, text: (decodedText && decodedText !== "undefined") ? decodedText : "[媒體]" };
            document.getElementById('reply-preview').style.display = 'block';
            document.getElementById('reply-text').innerText = replyTo.user + ": " + replyTo.text;
            closeAll();
        }
        function cancelReply() { replyTo = null; document.getElementById('reply-preview').style.display = 'none'; }

        db.ref('chats').on('value', snap => {
            const box = document.getElementById('chat-content');
            let html = ""; let lastD = "";
            allMessages = [];
            snap.forEach(c => {
                const m = c.val(); allMessages.push(m);
                const isMe = m.sender === MY_NAME;
                const d = new Date(m.timestamp).toLocaleDateString();
                if(d !== lastD) { html += `<div class="date-divider"><span>${d}</span></div>`; lastD = d; }
                const time = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const isSticker = m.type === 'sticker';
                
                // 相片加上 onclick 放大功能
                const content = m.type === 'text' ? `<span>${m.text}</span>` : `<img src="${m.data}" class="media-content" onclick="zoomImg('${m.data}')">`;
                
                const reply = m.replyTo ? `<div class="text-[10px] opacity-50 border-l-2 border-green-500 pl-1 mb-1">${m.replyTo.text}</div>` : "";
                const seenText = (isMe && m.seen) ? `<div class="text-[9px] text-gray-400 text-right">seen</div>` : "";
                html += `
                    <div class="msg-wrapper flex flex-col ${isMe?'items-end':'items-start'} mb-4 px-2" 
                         ontouchstart="handleStart('${c.key}','${m.sender}','${encodeURIComponent(m.text||"")}', event)" ontouchend="clearTimeout(longPressTimer)">
                        <div class="flex ${isMe?'flex-row':'flex-row-reverse'} items-end gap-1">
                            <span class="text-[9px] text-gray-400">${time}</span>
                            <div class="bubble ${isMe?'bubble-me':'bubble-other'} ${isSticker?'sticker-mode':''}">
                                ${reply} ${content} ${m.reaction ? `<div class="heart-react">${m.reaction}</div>` : ""}
                            </div>
                        </div>
                        ${seenText}
                    </div>`;
            });
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        });

        function autoProcessFile(input) {
            if(!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = (e) => sendMedia(e.target.result);
            reader.readAsDataURL(input.files[0]);
        }

        document.getElementById('chat-input').addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf("image") !== -1) {
                    const reader = new FileReader();
                    reader.onload = (ev) => sendMedia(ev.target.result);
                    reader.readAsDataURL(item.getAsFile());
                }
            }
        });
    </script>
</body>
</html>
