<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
            width: 100%;
            max-width: 400px;
        }
        p {
            font-size: 14px;
            color: #333;
            margin: 0;
        }
        .error-code {
            margin-top: 50px;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>404 Not Found</h1>
    <p>The requested URL was not found on this server.</p>
    
    <div class="error-code">
        HTTP 404 / ERR_CONNECTION_REFUSED
    </div>

</body>
</html>
