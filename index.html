<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>404 Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        /* --- 基礎樣式 --- */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: #fff; }
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        
        /* --- 404 偽裝層 --- */
        #fake-404 { position: fixed; inset: 0; z-index: 99999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; text-align: center; padding: 20px; }
        #unlock-timer { position: absolute; width: 60px; height: 60px; pointer-events: none; display: none; z-index: 100000; }
        #unlock-timer svg { transform: rotate(-90deg); }
        #unlock-timer circle { fill: none; stroke-width: 4; stroke: #eee; }
        #unlock-timer .progress { stroke: #bbb; stroke-dasharray: 151; stroke-dashoffset: 151; transition: stroke-dashoffset 0.1s linear; }

        /* --- 主程式容器 --- */
        #real-program { display: none; width: 100%; height: 100%; position: absolute; inset: 0; background: #fff; }
        #viewport { width: 100vw; height: 100%; overflow: hidden; position: relative; }
        #main-slider { display: flex; width: 200vw; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .page { width: 100vw; height: 100%; position: relative; display: flex; flex-direction: column; flex-shrink: 0; }
        
        /* --- 聊天室核心樣式 --- */
        #chat-bg-layer { position: absolute; inset: 0; z-index: 0; background-color: #efe7dd; background-size: cover; background-position: center; pointer-events: none; opacity: 1; }
        .chat-container { flex: 1; overflow-y: auto; z-index: 1; padding: 15px; position: relative; -webkit-overflow-scrolling: touch; }
        
        .bubble { max-width: 75%; padding: 8px 12px; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-break: break-all; }
        .bubble-me { background: #dcf8c6; border-radius: 12px 12px 0 12px; }
        .bubble-other { background: #fff; border-radius: 0 12px 12px 12px; }
        .bubble a { color: #007bff; text-decoration: underline; pointer-events: auto !important; }
        
        .img-mode { background: transparent !important; box-shadow: none !important; padding: 0 !important; }
        .img-mode img { border-radius: 12px; max-width: 200px; height: auto; display: block; }
        
        .avatar-box { width: 35px; height: 35px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #eee; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 選單與彈窗 */
        #overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.05); }
        .menu-pop { display: none; position: fixed; z-index: 3000; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        #photo-viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; align-items: center; justify-content: center; }
        
        /* 留言板樣式 */
        .memo-me { background: #e3f2fd; border-left: 5px solid #2196f3; }
        .memo-other { background: #fff9c4; border-left: 5px solid #fbc02d; }
    </style>
</head>
<body>

    <div id="fake-404">
        <div id="trigger-area">
            <h1 style="font-size: 24px; border-bottom: 1px solid #ddd; padding-bottom: 10px; width: 100%; color: #333; font-weight: normal;">404 Not Found</h1>
            <p style="margin-top: 15px; color: #666; font-size: 14px;">The requested URL was not found on this server.</p>
        </div>
        <div id="unlock-timer">
            <svg width="60" height="60"><circle cx="30" cy="30" r="24"></circle><circle class="progress" cx="30" cy="30" r="24"></circle></svg>
        </div>
    </div>

    <div id="real-program">
        <div id="viewport">
            <div id="main-slider">
                <div class="page" id="chat-page">
                    <div id="chat-bg-layer"></div>
                    <header class="h-14 bg-white/95 border-b flex items-center justify-between px-4 z-50">
                        <div class="flex items-center gap-2" onclick="openModal('profile-modal')">
                            <span id="display-name" class="font-bold text-sm">載入中...</span>
                        </div>
                        <div class="flex gap-4 text-gray-400">
                            <i class="fas fa-palette" onclick="openModal('bg-modal')"></i>
                            <i class="fas fa-images" onclick="openGallery()"></i>
                            <i class="fas fa-search" onclick="toggleSearch(true)"></i>
                            <i class="fas fa-trash-alt text-red-200" onclick="clearChat()"></i>
                        </div>
                    </header>

                    <div id="search-box" class="hidden absolute top-0 w-full h-14 bg-white z-[60] flex items-center px-4 border-b">
                        <i class="fas fa-arrow-left mr-4 text-gray-500 p-2" onclick="toggleSearch(false)"></i>
                        <input id="search-input" type="text" placeholder="搜尋訊息..." class="flex-1 bg-gray-100 rounded-full px-4 py-1.5 outline-none text-sm" oninput="doSearch()">
                    </div>

                    <div id="chat-flow" class="chat-container">
                        <div id="msg-list"></div>
                    </div>

                    <div id="reply-bar" class="hidden bg-white p-2 border-l-4 border-green-500 mx-2 mb-1 rounded flex justify-between items-center shadow-sm z-50">
                        <div id="reply-preview-text" class="text-xs text-gray-400 truncate pl-2"></div>
                        <i class="fas fa-times text-gray-300 p-1" onclick="cancelReply()"></i>
                    </div>

                    <footer class="p-3 bg-white border-t flex items-center gap-2 z-50">
                        <label class="text-green-500 text-2xl px-1"><i class="fas fa-plus-circle"></i><input type="file" id="msg-img-input" class="hidden" accept="image/*" onchange="sendImage(this)"></label>
                        <input id="chat-input" class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none" placeholder="輸入訊息...">
                        <button onclick="sendMsg()" class="bg-green-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-paper-plane text-sm"></i></button>
                    </footer>
                </div>

                <div class="page" id="board-page">
                    <header class="h-14 bg-white border-b flex items-center justify-between px-4 z-50">
                        <span class="font-bold">留言板 📌</span>
                        <button onclick="addMemo()" class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-xs font-bold">+ 寫留言</button>
                    </header>
                    <div id="memo-flow" class="flex-1 overflow-y-auto p-4 bg-gray-50"></div>
                </div>
            </div>
        </div>

        <div id="overlay" onclick="closeAll()"></div>
        <div id="react-bar" class="menu-pop rounded-full p-2 flex gap-1 items-center">
            <span onclick="react('❤️')" class="text-2xl p-1">❤️</span><span onclick="react('😂')" class="text-2xl p-1">😂</span><span onclick="react('😮')" class="text-2xl p-1">😮</span><span onclick="react('😢')" class="text-2xl p-1">😢</span><span onclick="react('👍')" class="text-2xl p-1">👍</span>
        </div>
        <div id="msg-menu" class="menu-pop flex flex-col w-[150px] overflow-hidden">
            <div class="p-4 border-b text-center text-blue-500 font-medium" onclick="setupReply()">回覆</div>
            <div class="p-4 border-b text-center text-gray-700 font-medium" onclick="copyMsg()">複製</div>
            <div id="menu-edit" class="p-4 border-b text-center text-green-600 font-medium" onclick="setupEdit()">編輯</div>
            <div id="menu-unsend" class="p-4 text-center text-red-500 font-bold" onclick="unsend()">撤回</div>
        </div>
        <div id="photo-viewer">
            <div class="absolute top-10 right-5 text-white text-2xl p-4" onclick="document.getElementById('photo-viewer').style.display='none'"><i class="fas fa-times"></i></div>
            <img id="full-img" class="max-w-full max-h-[90vh] object-contain">
        </div>

        <div id="profile-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-2xl z-[4000] w-[85%] hidden shadow-2xl">
            <h3 class="font-bold mb-4 text-center text-sm">個人設置</h3>
            <input id="set-name" type="text" placeholder="顯示名字" class="w-full border p-3 rounded mb-4 outline-none">
            <button class="w-full bg-blue-50 text-blue-600 py-3 rounded mb-2 font-bold text-xs" onclick="document.getElementById('set-avatar').click()">換頭像</button>
            <input type="file" id="set-avatar" class="hidden" onchange="handleAvatar(this)">
            <button class="w-full bg-green-600 text-white py-3 rounded font-bold" onclick="saveProfile()">儲存</button>
        </div>
    </div>

    <script>
        // --- 初始化 Firebase ---
        const firebaseConfig = { apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo", authDomain: "elise-99449.firebaseapp.com", databaseURL: "https://elise-99449-default-rtdb.firebaseio.com", projectId: "elise-99449", storageBucket: "elise-99449.appspot.com", messagingSenderId: "612842016696", appId: "1:612842016696:web:7485447024c7c36a3f094d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        let MY_NAME = urlParams.get('user') || "E";
        let curOtherAvatar = "", selectedID = null, replyData = null, isEditing = false, tempAvatar = null, lastTap = 0;

        // --- 1. 解鎖邏輯 ---
        let holdTimer, progressTimer, holdActive = false;
        const triggerArea = document.getElementById('trigger-area'), fakePage = document.getElementById('fake-404'), realApp = document.getElementById('real-program'), timerUI = document.getElementById('unlock-timer'), progressCircle = timerUI.querySelector('.progress');
        
        function startHold(e) {
            holdActive = true; let x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY;
            holdTimer = setTimeout(() => {
                if(!holdActive) return; timerUI.style.display = 'block'; timerUI.style.left = (x - 30) + 'px'; timerUI.style.top = (y - 80) + 'px';
                let start = Date.now(), duration = 4000;
                progressTimer = setInterval(() => {
                    let p = Math.min((Date.now() - start) / duration, 1);
                    progressCircle.style.strokeDashoffset = 151 - (151 * p);
                    if (p >= 1) { clearInterval(progressTimer); unlock(); }
                }, 50);
            }, 1000);
        }
        function endHold() { holdActive = false; clearTimeout(holdTimer); clearInterval(progressTimer); timerUI.style.display = 'none'; progressCircle.style.strokeDashoffset = 151; }
        function unlock() { fakePage.style.display = 'none'; realApp.style.display = 'block'; endHold(); }
        triggerArea.addEventListener('touchstart', startHold); triggerArea.addEventListener('touchend', endHold);

        // --- 2. 滑動切換頁面 ---
        let startX = 0, pageIdx = 0;
        const slider = document.getElementById('main-slider');
        window.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
        window.addEventListener('touchend', e => {
            if(realApp.style.display === 'none') return;
            let dx = startX - e.changedTouches[0].clientX;
            if(Math.abs(dx) > 100) { if(dx > 0 && pageIdx === 0) move(1); else if(dx < 0 && pageIdx === 1) move(0); }
        });
        function move(i) { pageIdx = i; slider.style.transform = `translateX(-${i * 100}vw)`; }

        // --- 3. 聊天核心與已讀時間 ---
        function linkify(text) {
            const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
            return text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
        }

        db.ref('chats').on('value', snap => {
            const list = document.getElementById('msg-list'); html = ""; let lastDate = "";
            snap.forEach(child => {
                const m = child.val(), id = child.key, isMe = m.sender === MY_NAME;

                // 已讀邏輯：如果不是我發的且沒看過，紀錄時間
                if(!isMe && !m.seen) {
                    db.ref('chats/'+id).update({ seen: true, seenTime: Date.now() });
                }

                const d = new Date(m.time).toLocaleDateString();
                if(d !== lastDate) { html += `<div class="text-center my-6"><span class="bg-black/5 text-gray-400 text-[10px] px-2 py-0.5 rounded-full">${d}</span></div>`; lastDate = d; }
                
                const avatar = !isMe ? `<div class="avatar-box mr-2"><img src="${curOtherAvatar}"></div>` : "";
                const content = m.type === 'img' ? `<img src="${m.data}" onclick="zoomImg('${m.data}')">` : `<span>${linkify(m.text)}</span>`;
                const seenLabel = (isMe && m.seen) ? `<span class="text-blue-400 font-bold">已讀 ${m.seenTime ? new Date(m.seenTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>` : '';

                html += `<div class="flex ${isMe?'justify-end':'justify-start'} mb-4 px-1 msg-row" onclick="handleDblClick('${id}')">
                    ${avatar}
                    <div class="flex flex-col ${isMe?'items-end':'items-start'}">
                        <div class="flex ${isMe?'flex-row-reverse':'flex-row'} items-end gap-1">
                            <div class="bubble ${isMe?'bubble-me':'bubble-other'} ${m.type==='img'?'img-mode':''}" 
                                 ontouchstart="handleTouchStart(event, '${id}', ${isMe}, '${encodeURIComponent(m.text||"")}')" 
                                 ontouchend="clearTimeout(lp)">
                                ${m.replyTo ? `<div class="text-[10px] opacity-40 border-l-2 border-green-500 pl-1 mb-1 truncate">${m.replyTo}</div>` : ''}
                                ${content}
                            </div>
                            <div class="text-[9px] text-gray-400 flex flex-col items-center">
                                ${seenLabel}
                                <span>${new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
            document.getElementById('chat-flow').scrollTo(0, 999999);
        });

        // --- 4. 輔助功能 ---
        function sendMsg() {
            const i = document.getElementById('chat-input'), t = i.value.trim();
            if(!t && !replyData) return;
            db.ref('chats').push({
                text: t,
                sender: MY_NAME,
                time: Date.now(),
                seen: false,
                replyTo: replyData ? replyData.text : null
            });
            i.value = ""; cancelReply();
        }

        function sendImage(i) {
            if(i.files[0]) {
                const r = new FileReader();
                r.onload = e => db.ref('chats').push({ type: 'img', data: e.target.result, sender: MY_NAME, time: Date.now(), seen: false });
                r.readAsDataURL(i.files[0]);
            }
        }

        let lp;
        function handleTouchStart(e, id, isMe, txt) {
            if(e.target.tagName === 'A') return;
            selectedID = id; window.lastSelectedTxt = decodeURIComponent(txt);
            lp = setTimeout(() => {
                const t = e.touches[0];
                document.getElementById('overlay').style.display = 'block';
                const rb = document.getElementById('react-bar');
                rb.style.display = 'flex'; rb.style.top = (t.clientY - 110)+'px'; rb.style.left = '50%'; rb.style.transform = 'translateX(-50%)';
                const mm = document.getElementById('msg-menu');
                mm.style.display = 'flex'; mm.style.top = (t.clientY + 20)+'px'; mm.style.left = '50%'; mm.style.transform = 'translateX(-50%)';
                document.getElementById('menu-unsend').style.display = isMe ? 'block' : 'none';
                document.getElementById('menu-edit').style.display = isMe ? 'block' : 'none';
            }, 600);
        }

        function closeAll() {
            ['overlay', 'msg-menu', 'react-bar', 'profile-modal'].forEach(id => {
                const el = document.getElementById(id);
                if(el.classList.contains('fixed')) el.classList.add('hidden');
                else el.style.display = 'none';
            });
        }

        function copyMsg() {
            navigator.clipboard.writeText(window.lastSelectedTxt);
            closeAll();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('overlay').style.display = 'block';
        }

        window.onload = () => {
            db.ref('notes/profile').on('value', snap => {
                const d = snap.val() || {};
                curOtherAvatar = d.avatar || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                document.getElementById('display-name').innerText = (d.name || "E ²") + " (" + MY_NAME + ")";
            });
            // 留言板同步
            db.ref('board').on('value', snap => {
                const flow = document.getElementById('memo-flow'); flow.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val(), color = m.user === MY_NAME ? 'memo-me' : 'memo-other';
                    flow.innerHTML += `<div class="p-4 rounded-xl mb-4 shadow-sm ${color}"><p class="text-sm">${linkify(m.text)}</p></div>`;
                });
            });
        };

        function addMemo() {
            const t = prompt("輸入留言:");
            if(t) db.ref('board').push({ text: t, time: Date.now(), user: MY_NAME });
        }
        
        function setupReply() {
            replyData = { text: window.lastSelectedTxt || "[圖片]" };
            document.getElementById('reply-bar').classList.remove('hidden');
            document.getElementById('reply-preview-text').innerText = replyData.text;
            closeAll();
        }
        function cancelReply() { replyData = null; document.getElementById('reply-bar').classList.add('hidden'); }
        function zoomImg(u) { document.getElementById('full-img').src = u; document.getElementById('photo-viewer').style.display = 'flex'; }
        function react(e) { db.ref('chats/'+selectedID+'/react').set(e); closeAll(); }
        function unsend() { if(confirm("撤回訊息？")) db.ref('chats/'+selectedID).remove(); closeAll(); }
    </script>
</body>
</html>
