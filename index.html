<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E ²</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #efe7dd; font-family: -apple-system, sans-serif; overflow: hidden; }
        .chat-container { height: calc(100vh - 130px); scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 8px 12px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .bubble-me { background-color: #dcf8c6; border-radius: 12px 12px 0 12px; align-self: flex-end; }
        .bubble-other { background-color: #ffffff; border-radius: 12px 12px 12px 0; align-self: flex-start; }
        .media-content { max-width: 200px; border-radius: 8px; display: block; margin: 4px 0; }
        #reaction-bar, #msg-menu { display: none; position: fixed; z-index: 300; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid #eee; }
        .date-divider { text-align: center; margin: 20px 0; }
        .date-divider span { background: rgba(0,0,0,0.2); color: white; padding: 3px 12px; border-radius: 10px; font-size: 11px; }
        .heart-react { position: absolute; bottom: -8px; right: 5px; background: white; border-radius: 10px; padding: 1px 5px; font-size: 12px; border: 1px solid #eee; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #search-box { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-white border-x">

    <div id="reaction-bar" class="p-2 flex gap-3">
        <span class="cursor-pointer text-2xl" onclick="addReact('❤️')">❤️</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😂')">😂</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😮')">😮</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('😢')">😢</span>
        <span class="cursor-pointer text-2xl" onclick="addReact('👍')">👍</span>
    </div>

    <div id="msg-menu" class="w-32 overflow-hidden">
        <div class="p-3 text-red-500 font-bold border-b cursor-pointer" onclick="executeUnsend()">撤回</div>
        <div class="p-3 text-blue-600 cursor-pointer" onclick="startReply()">回覆</div>
    </div>

    <header class="h-14 border-b flex items-center justify-between px-4 bg-white z-20">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>
            <span id="user-display" class="font-bold text-sm">E ²</span>
        </div>
        <div class="flex gap-4 items-center">
            <input id="search-input" type="text" placeholder="搜尋..." class="hidden border rounded-full px-3 py-1 text-xs outline-none w-24" oninput="doSearch()">
            <i class="fas fa-search text-gray-400 cursor-pointer" onclick="toggleSearch()"></i>
        </div>
    </header>

    <div id="chat-content" class="chat-container overflow-y-auto p-4 flex flex-col no-scrollbar"></div>

    <div id="reply-preview" class="hidden p-2 bg-gray-100 border-l-4 border-green-500 relative">
        <div id="reply-text" class="text-xs text-gray-500 truncate"></div>
        <i class="fas fa-times absolute right-2 top-2 text-gray-400" onclick="cancelReply()"></i>
    </div>

    <div class="p-3 bg-[#f0f2f5] flex items-center gap-2 border-t">
        <label class="text-green-600 text-2xl px-1 cursor-pointer">
            <i class="fas fa-plus-circle"></i>
            <input type="file" class="hidden" accept="image/*,video/*" onchange="autoProcessFile(this)">
        </label>
        <input id="chat-input" class="flex-1 bg-white rounded-full px-4 py-2 text-sm outline-none" placeholder="打字..." autocomplete="off">
        <button onclick="sendMessage()" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fas fa-paper-plane text-sm"></i>
        </button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo",
            authDomain: "elise-99449.firebaseapp.com",
            databaseURL: "https://elise-99449-default-rtdb.firebaseio.com",
            projectId: "elise-99449",
            storageBucket: "elise-99449.appspot.com",
            messagingSenderId: "612842016696",
            appId: "1:612842016696:web:7485447024c7c36a3f094d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        let MY_NAME = urlParams.get('user') || "E";
        document.getElementById('user-display').innerText = "E ² (" + MY_NAME + ")";

        let longPressTimer, selectedMsg = null, replyTo = null;

        function toggleSearch() {
            const input = document.getElementById('search-input');
            input.classList.toggle('hidden');
            if(!input.classList.contains('hidden')) input.focus();
        }

        function doSearch() {
            const val = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.bubble').forEach(b => {
                const text = b.innerText.toLowerCase();
                b.parentElement.parentElement.style.opacity = text.includes(val) ? "1" : "0.2";
            });
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() && !replyTo) return;
            db.ref('chats').push({ type:'text', text: input.value, sender: MY_NAME, timestamp: Date.now(), seen: false, replyTo: replyTo });
            input.value = ""; cancelReply();
        }

        function sendMedia(type, data) {
            db.ref('chats').push({ type, data, sender: MY_NAME, timestamp: Date.now(), seen: false });
        }

        function handleStart(id, sender, text, e) {
            selectedMsg = { id, sender, text };
            longPressTimer = setTimeout(() => {
                const rect = e.touches ? e.touches[0] : e;
                const bar = document.getElementById('reaction-bar');
                const menu = document.getElementById('msg-menu');
                bar.style.display = 'flex'; bar.style.top = (rect.clientY - 70) + 'px'; bar.style.left = '40px';
                menu.style.display = 'block'; menu.style.top = (rect.clientY + 10) + 'px'; menu.style.left = '40px';
            }, 600);
        }

        function closeAll() { document.getElementById('msg-menu').style.display = 'none'; document.getElementById('reaction-bar').style.display = 'none'; }
        window.onclick = (e) => { if(!e.target.closest('#msg-menu') && !e.target.closest('#reaction-bar')) closeAll(); };

        function addReact(emoji) { if(selectedMsg) db.ref('chats/'+selectedMsg.id).update({ reaction: emoji }); closeAll(); }
        function executeUnsend() { if(selectedMsg.sender === MY_NAME) db.ref('chats/'+selectedMsg.id).remove(); closeAll(); }
        function startReply() { 
            replyTo = { user: selectedMsg.sender, text: selectedMsg.text || "[媒體]" };
            document.getElementById('reply-preview').style.display = 'block';
            document.getElementById('reply-text').innerText = replyTo.user + ": " + replyTo.text;
            closeAll();
        }
        function cancelReply() { replyTo = null; document.getElementById('reply-preview').style.display = 'none'; }

        // Seen 邏輯
        db.ref('chats').on('child_added', snap => {
            if(snap.val().sender !== MY_NAME && !snap.val().seen) db.ref('chats/'+snap.key).update({seen:true});
        });

        // 渲染對話 (優化版：只渲染一次)
        db.ref('chats').on('value', snap => {
            const box = document.getElementById('chat-content');
            let html = ""; let lastD = "";
            snap.forEach(c => {
                const m = c.val(); const isMe = m.sender === MY_NAME;
                const d = new Date(m.timestamp).toLocaleDateString();
                if(d !== lastD) { html += `<div class="date-divider"><span>${d}</span></div>`; lastD = d; }
                const time = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const content = m.type==='text' ? `<span>${m.text}</span>` : `<img src="${m.data}" class="media-content">`;
                const reply = m.replyTo ? `<div class="text-[10px] opacity-50 border-l-2 border-green-500 pl-1 mb-1">${m.replyTo.text}</div>` : "";
                const seenText = (isMe && m.seen) ? `<div class="text-[9px] text-gray-400 text-right">seen</div>` : "";
                html += `
                    <div class="flex flex-col ${isMe?'items-end':'items-start'} mb-4 px-2" ontouchstart="handleStart('${c.key}','${m.sender}','${m.text||""}', event)" ontouchend="clearTimeout(longPressTimer)">
                        <div class="flex ${isMe?'flex-row':'flex-row-reverse'} items-end gap-1">
                            <span class="text-[9px] text-gray-400">${time}</span>
                            <div class="bubble ${isMe?'bubble-me':'bubble-other'}">
                                ${reply} ${content} ${m.reaction ? `<div class="heart-react">${m.reaction}</div>` : ""}
                            </div>
                        </div>
                        ${seenText}
                    </div>`;
            });
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        });

        function autoProcessFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => sendMedia('image', e.target.result);
            reader.readAsDataURL(input.files[0]);
        }
    </script>
</body>
</html>
