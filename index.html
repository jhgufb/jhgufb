<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E ²</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; font-size: 16px !important; }
        body { background-color: #efe7dd; font-family: -apple-system, sans-serif; overflow: hidden; touch-action: manipulation; }
        .chat-container { height: calc(100vh - 130px); scroll-behavior: smooth; position: relative; }
        .bubble { max-width: 85%; padding: 8px 12px; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .bubble-me { background-color: #dcf8c6; border-radius: 12px 12px 0 12px; align-self: flex-end; }
        .bubble-other { background-color: #ffffff; border-radius: 12px 12px 12px 0; align-self: flex-start; }
        .media-content { max-width: 180px; border-radius: 8px; display: block; margin: 4px 0; cursor: pointer; }
        #reaction-bar, #msg-menu { display: none; position: fixed; z-index: 500; background: white; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); border: 1px solid #eee; min-width: 140px; }
        .date-divider { text-align: center; margin: 20px 0; }
        .date-divider span { background: rgba(0,0,0,0.2); color: white; padding: 3px 12px; border-radius: 10px; font-size: 11px; }
        .heart-react { position: absolute; bottom: -8px; right: 5px; background: white; border-radius: 10px; padding: 1px 5px; font-size: 12px; border: 1px solid #eee; z-index: 10; }
        #photo-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #photo-viewer img { max-width: 95%; max-height: 90%; object-fit: contain; -webkit-touch-callout: default !important; -webkit-user-select: auto !important; }
        
        /* Pin Bar 樣式 */
        #pin-container { display: none; background: white; border-bottom: 1px solid #eee; padding: 8px 16px; align-items: center; gap: 10px; z-index: 40; position: relative; }
        #pin-text { font-size: 13px; color: #075e54; font-weight: bold; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

        .typing-indicator { display: none; align-self: flex-start; background: #fff; padding: 8px 12px; border-radius: 12px 12px 12px 0; margin-bottom: 10px; font-size: 13px; color: #888; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .dot { display: inline-block; width: 4px; height: 4px; margin-right: 2px; background: #bbb; border-radius: 50%; animation: blink 1.4s infinite both; }
        @keyframes blink { 0% { opacity: .2; transform: translateY(0); } 20% { opacity: 1; transform: translateY(-3px); } 100% { opacity: .2; transform: translateY(0); } }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-white border-x">

    <div id="close-overlay" class="fixed top-0 left-0 w-full h-full z-[400] hidden" onclick="closeAll()"></div>
    
    <div id="photo-viewer" onclick="if(event.target === this) this.style.display='none'">
        <img id="full-img" src="" ontouchstart="event.stopPropagation()">
    </div>

    <div id="pin-container">
        <i class="fas fa-thumbtack text-green-600 text-sm"></i>
        <div id="pin-text" onclick="goToPinnedMsg()">載入置頂訊息...</div>
        <div id="pin-count" class="text-[10px] text-gray-400">1/3</div>
        <i class="fas fa-chevron-right text-gray-300 text-xs ml-1" onclick="nextPin()"></i>
    </div>

    <header class="h-14 border-b flex items-center justify-between px-4 bg-white z-20">
        <div class="flex items-center gap-2"><span class="w-2 h-2 bg-green-500 rounded-full"></span><span id="user-display" class="font-bold text-sm text-gray-700">E ²</span></div>
        <div class="flex gap-1">
            <i class="fas fa-images text-gray-400 p-2" onclick="toggleMediaPage(true)"></i>
            <i class="fas fa-search text-gray-400 p-2" onclick="toggleSearch(true)"></i>
            <i class="fas fa-trash-alt text-red-200 p-2" onclick="clearAllHistory()"></i>
        </div>
    </header>

    <div id="reaction-bar" class="p-2 flex gap-2 items-center justify-center">
        <span onclick="addReact('❤️')">❤️</span><span onclick="addReact('😂')">😂</span><span onclick="addReact('😮')">😮</span><span onclick="addReact('😢')">😢</span><span onclick="addReact('👍')">👍</span>
        <button onclick="openEmojiPicker()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"><i class="fas fa-plus text-xs text-gray-500"></i></button>
        <input type="text" id="emoji-trigger" class="absolute opacity-0 w-0 h-0" oninput="handleCustomEmoji(this)">
    </div>

    <div id="msg-menu">
        <div id="menu-pin" class="p-3 text-gray-700 border-b flex items-center gap-3" onclick="togglePin()">
            <i class="fas fa-thumbtack text-gray-400"></i> <span id="pin-btn-text">釘選訊息</span>
        </div>
        <div id="menu-unsend" class="p-3 text-red-500 border-b flex items-center gap-3" onclick="executeUnsend()">
            <i class="fas fa-undo"></i> 撤回
        </div>
        <div class="p-3 text-blue-600 flex items-center gap-3" onclick="startReply()">
            <i class="fas fa-reply"></i> 回覆
        </div>
    </div>

    <div id="chat-content" class="chat-container overflow-y-auto p-4 flex flex-col no-scrollbar">
        <div id="msg-list" class="flex flex-col"></div>
        <div id="typing-box" class="typing-indicator">
            <span id="typing-name"></span> 正在輸入<span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>

    <div id="reply-preview" class="hidden p-3 bg-white border-l-4 border-green-500 mx-2 mb-2 rounded shadow-sm relative">
        <div id="reply-text" class="text-xs text-gray-500 truncate"></div>
        <i class="fas fa-times absolute right-2 top-2 text-gray-300" onclick="cancelReply()"></i>
    </div>

    <div class="p-3 bg-[#f0f2f5] flex items-center gap-2 border-t">
        <label class="text-green-600 text-2xl px-1"><i class="fas fa-plus-circle"></i><input type="file" id="file-input" class="hidden" onchange="autoProcessFile(this)"></label>
        <input id="chat-input" class="flex-1 bg-white rounded-full px-4 py-2 text-sm outline-none shadow-sm" placeholder="打字..." oninput="updateTypingStatus()">
        <button onclick="sendMessage()" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane text-sm"></i></button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo",
            authDomain: "elise-99449.firebaseapp.com",
            databaseURL: "https://elise-99449-default-rtdb.firebaseio.com",
            projectId: "elise-99449",
            storageBucket: "elise-99449.appspot.com",
            messagingSenderId: "612842016696",
            appId: "1:612842016696:web:7485447024c7c36a3f094d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const urlParams = new URLSearchParams(window.location.search);
        let MY_NAME = urlParams.get('user') || "E";

        let selectedMsg = null, replyTo = null, typingTimer, pinnedMsgs = [], currentPinIdx = 0;

        // --- Pin Logic ---
        db.ref('pins').on('value', snap => {
            pinnedMsgs = [];
            snap.forEach(c => { pinnedMsgs.push({ id: c.key, ...c.val() }); });
            const bar = document.getElementById('pin-container');
            if (pinnedMsgs.length > 0) {
                bar.style.display = 'flex';
                updatePinBar();
            } else {
                bar.style.display = 'none';
            }
        });

        function updatePinBar() {
            if (pinnedMsgs.length === 0) return;
            if (currentPinIdx >= pinnedMsgs.length) currentPinIdx = 0;
            const pin = pinnedMsgs[currentPinIdx];
            document.getElementById('pin-text').innerText = pin.text;
            document.getElementById('pin-count').innerText = `${currentPinIdx + 1}/${pinnedMsgs.length}`;
        }

        function nextPin() {
            currentPinIdx = (currentPinIdx + 1) % pinnedMsgs.length;
            updatePinBar();
        }

        function togglePin() {
            if (!selectedMsg) return;
            const isPinned = pinnedMsgs.find(p => p.id === selectedMsg.id);
            if (isPinned) {
                db.ref('pins/' + selectedMsg.id).remove();
            } else {
                if (pinnedMsgs.length >= 3) {
                    alert("最多只能置頂 3 條訊息！請先取消舊的置頂。");
                } else {
                    db.ref('pins/' + selectedMsg.id).set({ text: selectedMsg.text, timestamp: Date.now() });
                }
            }
            closeAll();
        }

        function goToPinnedMsg() {
            const pin = pinnedMsgs[currentPinIdx];
            const el = document.getElementById('msg-' + pin.id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('ring-4', 'ring-green-300', 'transition-all');
                setTimeout(() => el.classList.remove('ring-4', 'ring-green-300'), 2000);
            } else {
                alert("找不到該訊息（可能已被撤回）");
            }
        }

        // --- Typing Status ---
        function updateTypingStatus() {
            db.ref('typing/' + MY_NAME).set(true);
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => db.ref('typing/' + MY_NAME).set(false), 2000);
        }

        db.ref('typing').on('value', snap => {
            const typingData = snap.val() || {};
            let someoneTyping = false;
            for (let user in typingData) {
                if (user !== MY_NAME && typingData[user] === true) {
                    document.getElementById('typing-name').innerText = user;
                    someoneTyping = true; break;
                }
            }
            document.getElementById('typing-box').style.display = someoneTyping ? 'block' : 'none';
        });

        // --- Core Messaging ---
        db.ref('chats').on('value', snap => {
            const list = document.getElementById('msg-list');
            let html = ""; let lastD = "";
            snap.forEach(c => {
                const m = c.val();
                const isMe = m.sender === MY_NAME;
                if (!isMe && m.seen === false) db.ref('chats/' + c.key).update({ seen: true });
                const d = new Date(m.timestamp).toLocaleDateString();
                if(d !== lastD) { html += `<div class="date-divider"><span>${d}</span></div>`; lastD = d; }
                const time = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const content = m.type === 'text' ? `<span>${m.text}</span>` : `<img src="${m.data}" class="media-content" onclick="zoomImg('${m.data}')">`;
                const reply = m.replyTo ? `<div class="text-[10px] opacity-50 border-l-2 border-green-500 pl-1 mb-1">${m.replyTo.text}</div>` : "";
                const seenStatus = (isMe) ? (m.seen ? '<i class="fas fa-check-double text-blue-500 ml-1"></i>' : '<i class="fas fa-check ml-1"></i>') : "";

                html += `
                    <div id="msg-${c.key}" class="msg-wrapper flex flex-col ${isMe?'items-end':'items-start'} mb-4 px-2" 
                         ontouchstart="handleStart('${c.key}','${m.sender}','${encodeURIComponent(m.text||"")}', event)" ontouchend="clearTimeout(longPressTimer)">
                        <div class="flex ${isMe?'flex-row':'flex-row-reverse'} items-end gap-1">
                            <span class="text-[9px] text-gray-400">${time}</span>
                            <div class="bubble ${isMe?'bubble-me':'bubble-other'} ${m.type==='sticker'?'sticker-mode':''}">
                                ${reply} ${content} ${m.reaction ? `<div class="heart-react">${m.reaction}</div>` : ""}
                            </div>
                        </div>
                        <div class="text-[9px] text-right">${seenStatus}</div>
                    </div>`;
            });
            list.innerHTML = html;
            document.getElementById('chat-content').scrollTop = document.getElementById('chat-content').scrollHeight;
        });

        function handleStart(id, sender, text, e) {
            selectedMsg = { id, sender, text: decodeURIComponent(text) || "[媒體]" };
            const isPinned = pinnedMsgs.find(p => p.id === id);
            document.getElementById('pin-btn-text').innerText = isPinned ? "取消釘選" : "釘選訊息";
            
            longPressTimer = setTimeout(() => {
                const rect = e.touches ? e.touches[0] : e;
                const bar = document.getElementById('reaction-bar');
                const menu = document.getElementById('msg-menu');
                const overlay = document.getElementById('close-overlay');
                document.getElementById('menu-unsend').style.display = (sender === MY_NAME) ? 'flex' : 'none';
                overlay.style.display = 'block';
                bar.style.display = 'flex'; bar.style.top = (rect.clientY - 90) + 'px'; bar.style.left = '20px';
                menu.style.display = 'block'; menu.style.top = (rect.clientY + 10) + 'px'; menu.style.left = '20px';
                if (navigator.vibrate) navigator.vibrate(40);
            }, 600);
        }

        function closeAll() {
            document.getElementById('msg-menu').style.display = 'none';
            document.getElementById('reaction-bar').style.display = 'none';
            document.getElementById('close-overlay').style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim() && !replyTo) return;
            db.ref('typing/' + MY_NAME).set(false);
            db.ref('chats').push({ type:'text', text: input.value, sender: MY_NAME, timestamp: Date.now(), seen: false, replyTo: replyTo });
            input.value = ""; cancelReply();
        }

        function sendMedia(data) { db.ref('chats').push({ type:'sticker', data: data, sender: MY_NAME, timestamp: Date.now(), seen: false }); }
        function addReact(emoji) { if(selectedMsg) db.ref('chats/'+selectedMsg.id).update({ reaction: emoji }); closeAll(); }
        function executeUnsend() { if(selectedMsg && selectedMsg.sender === MY_NAME) { db.ref('chats/'+selectedMsg.id).remove(); db.ref('pins/'+selectedMsg.id).remove(); } closeAll(); }
        function startReply() { replyTo = { user: selectedMsg.sender, text: selectedMsg.text }; document.getElementById('reply-preview').style.display = 'block'; document.getElementById('reply-text').innerText = replyTo.user + ": " + replyTo.text; closeAll(); }
        function cancelReply() { replyTo = null; document.getElementById('reply-preview').style.display = 'none'; }
        function openEmojiPicker() { document.getElementById('emoji-trigger').focus(); }
        function handleCustomEmoji(input) { if (input.value.trim()) { addReact(input.value.trim()); input.value = ""; input.blur(); } }
        function zoomImg(src) { document.getElementById('full-img').src = src; document.getElementById('photo-viewer').style.display = 'flex'; }
        function clearAllHistory() { if (confirm("⚠️ 確定要刪除所有紀錄嗎？")) { db.ref('chats').remove(); db.ref('pins').remove(); } }
        function autoProcessFile(input) { if(input.files[0]) { const r = new FileReader(); r.onload = (e) => sendMedia(r.result); r.readAsDataURL(input.files[0]); } }
    </script>
</body>
</html>
