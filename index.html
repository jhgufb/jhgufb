<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>404 Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        /* 禁止全域選取 */
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        
        #fake-404 { position: fixed; inset: 0; z-index: 99999; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        
        #real-program { display: none; width: 100%; height: 100%; position: absolute; inset: 0; background: #fff; }
        #viewport { width: 100vw; height: 100%; overflow: hidden; position: relative; }
        #main-slider { display: flex; width: 200vw; height: 100%; transition: transform 0.3s ease; }
        .page { width: 100vw; height: 100%; position: relative; display: flex; flex-direction: column; flex-shrink: 0; }
        
        #chat-bg-layer { position: absolute; inset: 0; z-index: 0; background-color: #efe7dd; pointer-events: none; }
        .chat-container { flex: 1; overflow-y: auto; z-index: 1; padding: 15px; position: relative; }
        
        /* 氣泡專用防選取 */
        .bubble { 
            max-width: 75%; padding: 8px 12px; font-size: 15px; position: relative; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-break: break-all;
            pointer-events: auto;
        }
        .bubble-me { background: #dcf8c6; border-radius: 12px 12px 0 12px; }
        .bubble-other { background: #fff; border-radius: 0 12px 12px 12px; }
        
        /* 選單樣式 */
        #overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.1); }
        .menu-pop { 
            display: none; position: fixed; z-index: 3000; background: white; 
            border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        #unlock-timer { position: absolute; width: 60px; height: 60px; pointer-events: none; display: none; z-index: 100000; }
        #unlock-timer .progress { stroke: #bbb; stroke-dasharray: 151; stroke-dashoffset: 151; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="fake-404">
        <div id="trigger-area" class="cursor-pointer">
            <h1 class="text-2xl border-b pb-2 text-gray-800">404 Not Found</h1>
            <p class="mt-4 text-gray-500">The requested URL was not found on this server.</p>
        </div>
        <div id="unlock-timer">
            <svg width="60" height="60" style="transform: rotate(-90deg);"><circle cx="30" cy="30" r="24" fill="none" stroke="#eee" stroke-width="4"></circle><circle class="progress" cx="30" cy="30" r="24" fill="none" stroke-width="4" transition="all 0.1s"></circle></svg>
        </div>
    </div>

    <div id="real-program">
        <div id="viewport">
            <div id="main-slider">
                <div class="page">
                    <div id="chat-bg-layer"></div>
                    <header class="h-14 bg-white/95 border-b flex items-center justify-between px-4 z-50 relative">
                        <span id="display-name" class="font-bold">載入中...</span>
                        <div class="flex gap-4 text-gray-500 text-lg">
                            <i class="fas fa-palette" onclick="alert('背景功能維護中')"></i>
                            <i class="fas fa-images" onclick="alert('相簿功能維護中')"></i>
                            <i class="fas fa-search"></i>
                            <i class="fas fa-trash-alt text-red-300" onclick="clearAllMsg()"></i>
                        </div>
                    </header>

                    <div id="chat-flow" class="chat-container">
                        <div id="msg-list"></div>
                    </div>

                    <footer class="p-3 bg-white border-t flex items-center gap-2 z-50">
                        <input id="chat-input" class="flex-1 bg-gray-100 rounded-full px-4 py-2 outline-none" placeholder="輸入訊息...">
                        <button onclick="sendMsg()" class="bg-green-500 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
                    </footer>
                </div>
                
                <div class="page bg-gray-50">
                    <header class="h-14 bg-white border-b flex items-center px-4 font-bold">留言板 📌</header>
                    <div class="p-4">滑動切換回聊天室</div>
                </div>
            </div>
        </div>

        <div id="overlay" onclick="closeAll()"></div>
        
        <div id="react-bar" class="menu-pop rounded-full p-2 flex gap-2">
            <span onclick="react('❤️')" class="text-2xl">❤️</span>
            <span onclick="react('😂')" class="text-2xl">😂</span>
            <span onclick="react('😮')" class="text-2xl">😮</span>
            <span onclick="react('😢')" class="text-2xl">😢</span>
            <span onclick="react('👍')" class="text-2xl">👍</span>
        </div>

        <div id="msg-menu" class="menu-pop flex flex-col w-40">
            <div class="p-4 border-b text-center text-blue-500" onclick="setupReply()">回覆</div>
            <div class="p-4 border-b text-center text-gray-700" onclick="copyMsg()">複製</div>
            <div class="p-4 border-b text-center text-green-600 font-bold" onclick="setupEdit()">編輯</div>
            <div class="p-4 text-center text-red-500 font-bold" onclick="unsendMsg()">撤回</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAauSWTZnyVdX0s2aMgqaWey2TQTI3Pmamo", databaseURL: "https://elise-99449-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const MY_NAME = new URLSearchParams(window.location.search).get('user') || "E";
        let selectedID = null, longPressTimer;

        // --- 1. 解鎖邏輯 ---
        const trigger = document.getElementById('trigger-area');
        trigger.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let start = Date.now();
            document.getElementById('unlock-timer').style.display = 'block';
            longPressTimer = setInterval(() => {
                let p = (Date.now() - start) / 4000;
                document.querySelector('.progress').style.strokeDashoffset = 151 - (151 * p);
                if(p >= 1) { 
                    clearInterval(longPressTimer);
                    document.getElementById('fake-404').style.display = 'none';
                    document.getElementById('real-program').style.display = 'block';
                }
            }, 50);
        });
        trigger.addEventListener('touchend', () => { 
            clearInterval(longPressTimer); 
            document.getElementById('unlock-timer').style.display = 'none'; 
        });

        // --- 2. 聊天邏輯 ---
        db.ref('chats').on('value', snap => {
            const list = document.getElementById('msg-list');
            let html = "";
            snap.forEach(child => {
                const m = child.val(), id = child.key, isMe = m.sender === MY_NAME;
                html += `
                    <div class="flex ${isMe?'justify-end':'justify-start'} mb-4 px-1">
                        <div class="bubble ${isMe?'bubble-me':'bubble-other'}" 
                             ontouchstart="handleMsgTouch(event, '${id}', '${encodeURIComponent(m.text)}')" 
                             ontouchend="clearTimeout(msgLP)">
                            ${m.text}
                            ${m.react ? `<div class="absolute -bottom-2 -right-2 bg-white rounded-full px-1 text-xs shadow-sm">${m.react}</div>`:''}
                        </div>
                    </div>`;
            });
            list.innerHTML = html;
            document.getElementById('chat-flow').scrollTo(0, 99999);
        });

        let msgLP;
        function handleMsgTouch(e, id, txt) {
            selectedID = id;
            window.lastTxt = decodeURIComponent(txt);
            msgLP = setTimeout(() => {
                const t = e.touches[0];
                document.getElementById('overlay').style.display = 'block';
                const rb = document.getElementById('react-bar');
                rb.style.display = 'flex'; rb.style.top = (t.clientY - 100) + 'px'; rb.style.left = '50%'; rb.style.transform = 'translateX(-50%)';
                const mm = document.getElementById('msg-menu');
                mm.style.display = 'flex'; mm.style.top = (t.clientY + 20) + 'px'; mm.style.left = '50%'; mm.style.transform = 'translateX(-50%)';
            }, 600);
        }

        function sendMsg() {
            const val = document.getElementById('chat-input').value;
            if(!val) return;
            db.ref('chats').push({ text: val, sender: MY_NAME, time: Date.now() });
            document.getElementById('chat-input').value = "";
        }

        function setupEdit() {
            const newTxt = prompt("編輯訊息：", window.lastTxt);
            if(newTxt) db.ref('chats/' + selectedID).update({ text: newTxt });
            closeAll();
        }

        function unsendMsg() {
            if(confirm("確定要撤回嗎？")) db.ref('chats/' + selectedID).remove();
            closeAll();
        }

        function clearAllMsg() {
            if(confirm("警告：這會清空所有人的聊天紀錄！確定？")) db.ref('chats').remove();
        }

        function react(emoji) {
            db.ref('chats/' + selectedID).update({ react: emoji });
            closeAll();
        }

        function closeAll() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('react-bar').style.display = 'none';
            document.getElementById('msg-menu').style.display = 'none';
        }

        function copyMsg() {
            navigator.clipboard.writeText(window.lastTxt);
            closeAll();
        }

        document.getElementById('display-name').innerText = "Chat (" + MY_NAME + ")";
    </script>
</body>
</html>
